<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP EXTRA - เปลี่ยนโลโก้ระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เรียกใช้ไฟล์ manifest -->
<link rel="manifest" href="manifest.json">

<!-- กำหนดสีแถบด้านบนของมือถือ (Theme Color) -->
<meta name="theme-color" content="#8b5cf6">

<!-- รองรับไอคอนสำหรับ iOS (Apple แอบเรื่องมากนิดนึงครับ) -->
<link rel="apple-touch-icon" href="assets/icon-192x192.png">
</head>
<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm mt-6">
        <h1 class="text-xl font-bold text-gray-800 mb-2">🏢 เปลี่ยนโลโก้ / ไอคอนแบรนด์</h1>
        <p class="text-xs text-gray-500 mb-6">อัปโหลดโลโก้ใหม่ ระบบจะปรับขนาดและบีบอัดให้พอดีกับการใช้งานทันที</p>

        <!-- แสดงโลโก้ปัจจุบัน -->
        <div class="mb-6 text-center">
            <p class="text-xs text-gray-400 mb-2">โลโก้ปัจจุบัน:</p>
            <img id="current-logo" src="https://via.placeholder.com/150" alt="Current Logo" class="w-24 h-24 object-contain mx-auto border rounded-xl p-2 bg-gray-50">
        </div>

        <form id="logo-form" class="space-y-4">
            <div>
                <input type="file" id="logo-file" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
            </div>

            <button type="submit" id="btn-save" class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 transition shadow">
                อัปเดตโลโก้ใหม่ทันที
            </button>
        </form>
    </div>

    <script>
        document.getElementById('logo-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            const fileInput = document.getElementById('logo-file').files[0];
            if (!fileInput) return;

            btn.disabled = true;
            btn.innerText = "กำลังอัปเดตโลโก้...";

            const formData = new FormData();
            formData.append("file", fileInput);
            formData.append("usage_type", "icon"); // ระบุว่าเป็นไอคอน/โลโก้ ไม่ต้องใช้ AI

            try {
                const res = await fetch("https://tp-extra-system-production.up.railway.app/api/v1/admin/upload-image", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    alert("เปลี่ยนโลโก้สำเร็จ!");
                    document.getElementById('current-logo').src = "https://tp-extra-system-production.up.railway.app" + data.image_url;
                } else {
                    alert("เกิดข้อผิดพลาด");
                }
            } catch (err) {
                alert("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");
            } finally {
                btn.disabled = false;
                btn.innerText = "อัปเดตโลโก้ใหม่ทันที";
            }
        });
    
<script src="auth.js"></script>
</body>
</html>
