<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ประวัติรายการ - TP EXTRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
</head>
<body class="bg-gray-50 min-h-screen font-sans select-none pb-10">

    <!-- แถบด้านบน -->
    <div class="bg-purple-600 text-white p-4 shadow-md sticky top-0 z-10 flex items-center">
        <button onclick="window.location.href='dashboard.html'" class="mr-4 active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-lg font-bold tracking-wide">ประวัติการทำรายการ</h1>
    </div>

    <!-- ส่วนแสดงประวัติ -->
    <div class="p-4 max-w-md mx-auto">
        <div id="loading" class="text-center text-gray-500 py-10">
            <svg class="w-8 h-8 mx-auto animate-spin mb-2 text-purple-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            กำลังโหลดข้อมูล...
        </div>

        <div id="emptyState" class="hidden text-center text-gray-400 py-16">
            <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <p>ยังไม่มีประวัติการทำรายการ</p>
        </div>

        <!-- รายการธุรกรรมจะถูกแสดงที่นี่ -->
        <div id="historyList" class="flex flex-col gap-3 hidden">
            <!-- ข้อมูลจาก JS จะถูกนำมาใส่ตรงนี้ -->
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const API_URL = "https://tp-extra-system-production.up.railway.app";

        async function fetchHistory() {
            const token = localStorage.getItem("tpx_access_token");
            if (!token) {
                window.location.href = "index.html";
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/v1/wallets/history`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('loading').classList.add('hidden');
                    renderHistory(result.data);
                } else {
                    alert("ไม่สามารถดึงข้อมูลได้ เซสชันอาจหมดอายุ");
                    window.location.href = "index.html";
                }
            } catch (err) {
                console.error("Fetch history error:", err);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
            }
        }

        function renderHistory(data) {
            const listContainer = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            
            if (!data || data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            listContainer.classList.remove('hidden');
            let htmlString = "";

            data.forEach(item => {
                // แยกแยะสีและไอคอน (เข้าสีเขียว/ออกสีแดง)
                const colorClass = item.is_income ? 'text-green-600' : 'text-red-500';
                const sign = item.is_income ? '+' : '-';
                const iconBgClass = item.is_income ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-500';
                const iconPath = item.is_income 
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>' // ลูกศรลง (รับเงิน)
                    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>'; // ลูกศรขึ้น (โอนออก)

                // เปลี่ยนชื่อประเภทภาษาอังกฤษให้เป็นภาษาไทย
                let typeName = "ทำรายการ";
                if (item.type === 'TRANSFER') typeName = item.is_income ? "รับเงินโอน" : "โอนเงิน";
                else if (item.type === 'TOPUP') typeName = "เติมเงิน";
                else if (item.type === 'PURCHASE') typeName = "ซื้อสินค้า";

                htmlString += `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${iconBgClass}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">${iconPath}</svg>
                        </div>
                        <div>
                            <p class="font-bold text-gray-800 text-sm">${typeName}</p>
                            <p class="text-[11px] text-gray-400 mt-0.5">${item.date} • ${item.reference_no}</p>
                            <p class="text-[12px] text-gray-500 mt-1 truncate max-w-[140px]">${item.description}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold ${colorClass} text-base">${sign}${item.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}</p>
                    </div>
                </div>`;
            });

            listContainer.innerHTML = htmlString;
        }

        // โหลดประวัติทันทีที่เปิดหน้า
        fetchHistory();
    </script>
</body>
</html>
