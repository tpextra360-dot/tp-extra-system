<div class="bg-white p-6 rounded-xl shadow space-y-4">
    <h2 class="text-lg font-bold text-gray-800">เปลี่ยนไอคอนระบบ (PWA App Icon)</h2>
    <p class="text-sm text-gray-500">อัปโหลดภาพต้นฉบับเพียง 1 ภาพ ระบบจะปรับขนาด 192x192 และ 512x512 ให้เข้ากับจอมือถือโดยอัตโนมัติ</p>
    
    <input type="file" id="logo-input" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
    
    <button onclick="uploadNewLogo()" id="upload-logo-btn" class="bg-purple-700 text-white px-4 py-2 rounded-lg font-semibold hover:bg-purple-800">
        อัปเดตไอคอนแอป
    </button>
</div>

<script>
async function uploadNewLogo() {
    const fileInput = document.getElementById('logo-input');
    if (fileInput.files.length === 0) return alert('กรุณาเลือกไฟล์ก่อน');

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    const btn = document.getElementById('upload-logo-btn');
    btn.disabled = true;
    btn.innerText = "กำลังแปลงขนาดและอัปโหลด...";

    try {
        const res = await fetch('https://tp-extra-system-production.up.railway.app/api/v1/admin/upload-app-logo', {
            method: 'POST',
            body: formData
        });
        const result = await res.json();
        
        if (res.ok) {
            alert('อัปเดตไอคอนแอปสำเร็จทั้ง 2 ขนาดเรียบร้อย!');
        } else {
            alert('เกิดข้อผิดพลาด: ' + result.detail);
        }
    } catch (e) {
        alert('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
    } finally {
        btn.disabled = false;
        btn.innerText = "อัปเดตไอคอนแอป";
    }
}
</script>
