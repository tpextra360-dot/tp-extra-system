<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - TP Extra</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6a1b9a">
    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #6a1b9a; margin-bottom: 10px; background: #eee; }
        .line-name { font-size: 1.2rem; font-weight: bold; color: #333; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 1.1rem; text-align: center; }
        input[readonly] { background-color: #f5f5f5; color: #888; }
        
        .consent-box { font-size: 0.85rem; text-align: left; margin: 20px 0; display: flex; align-items: flex-start; gap: 10px; }
        .btn-submit { background-color: #6a1b9a; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; position: absolute; top:0; left:0; background: #f4f6f9; z-index: 50; }
    </style>
    <!-- เรียกใช้ไฟล์ manifest -->
<link rel="manifest" href="manifest.json">

<!-- กำหนดสีแถบด้านบนของมือถือ (Theme Color) -->
<meta name="theme-color" content="#8b5cf6">

<!-- รองรับไอคอนสำหรับ iOS (Apple แอบเรื่องมากนิดนึงครับ) -->
<link rel="apple-touch-icon" href="assets/icon-192x192.png">
</head>
<body>

<div id="loading"><h3 style="color: #6a1b9a;">กำลังโหลดข้อมูลบัญชี LINE...</h3></div>

<div class="card" id="appContent" style="display: none;">
    <img id="profileImage" class="profile-img" src="https://via.placeholder.com/150" alt="Profile">
    <div class="line-name" id="displayName">ผู้ใช้ทั่วไป</div>
    
    <div class="form-group">
        <label>ชื่อ-นามสกุล (ตรงตามบัตรประชาชน)</label>
        <input type="text" id="fullName" placeholder="เช่น สมชาย รักดี" onkeyup="checkReady()">
    </div>

    <div class="form-group">
        <label>รหัสผู้แนะนำ (ถ้ามี)</label>
        <input type="text" id="sponsorCode" placeholder="TPX-XXXXX">
    </div>

    <div class="form-group">
        <label>เบอร์โทรศัพท์ (ใส่แค่ 10 หลัก)</label>
        <input type="tel" id="phone" maxlength="10" placeholder="08xxxxxxxx" onkeyup="checkReady()">
    </div>

    <div class="consent-box">
        <input type="checkbox" id="consentCheck" onchange="checkReady()" style="width: 20px; margin-top: 3px;">
        <span>ฉันอายุครบ 20 ปีบริบูรณ์ และยอมรับ<a href="policy.html" target="_blank" style="color: #6a1b9a; text-decoration: underline;">นโยบายความเป็นส่วนตัว (PDPA)</a></span>
    </div>

    <button type="button" id="submitBtn" class="btn-submit" disabled onclick="submitRegistration()">เข้าสู่ระบบ / สมัครสมาชิก</button>
</div>

<script>
    const LIFF_ID = "2011278014-ykejPzwR";
    let lineUserId = "";

    async function initializeLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('profileImage').src = profile.pictureUrl;
                document.getElementById('displayName').innerText = profile.displayName;
                lineUserId = profile.userId;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
            } else {
                liff.login();
            }
        } catch (error) {
            console.error('LIFF Error:', error);
            document.getElementById('loading').innerHTML = '<h3 style="color:red;">โหลด LINE LIFF ไม่สำเร็จ กรุณาเปิดผ่านแอป LINE</h3>';
        }
    }

    function checkReady() {
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const consent = document.getElementById('consentCheck').checked;
        const btn = document.getElementById('submitBtn');
        
        if (fullName.length > 2 && phone.length === 10 && consent) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    async function submitRegistration() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "กำลังดำเนินการ...";

        const payload = {
            full_name: document.getElementById('fullName').value.trim(),
            phone_number: document.getElementById('phone').value.trim(),
            upline_member_code: document.getElementById('sponsorCode').value.trim() || null,
            line_user_id: lineUserId,
            is_consent_age: document.getElementById('consentCheck').checked
        };

        try {
            const response = await fetch('https://tp-extra-system-production.up.railway.app/api/v1/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            if (response.ok) {
                alert(`สมัครสมาชิกสำเร็จ! รหัสของคุณคือ: ${result.member_code}`);
                window.location.href = "index.html"; // เปลี่ยนหน้าไปหน้าหลักหลังสมัครเสร็จ
            } else {
                alert(`ข้อผิดพลาด: ${result.detail}`);
                btn.disabled = false;
                btn.innerText = "เข้าสู่ระบบ / สมัครสมาชิก";
            }
        } catch (error) {
            alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่');
            btn.disabled = false;
            btn.innerText = "เข้าสู่ระบบ / สมัครสมาชิก";
        }
    }

    initializeLiff();

<script src="auth.js"></script>
</body>
</html>
