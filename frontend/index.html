<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Extra System - อัปโหลดสลิปชำระเงิน</title>
    <!-- นำเข้า Tailwind CSS สำหรับตกแต่งหน้าตาให้สวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">ระบบตรวจสอบสลิป</h1>
            <p id="user-info" class="text-sm text-gray-500 mt-1">กำลังโหลดข้อมูลผู้ใช้...</p>
        </div>

        <!-- ฟอร์มส่งข้อมูล -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ยอดเงินที่ต้องชำระ (บาท)</label>
                <input type="number" id="expected-amount" value="500" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="ระบุยอดเงิน">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อัปโหลดรูปภาพสลิป</label>
                <input type="file" id="slip-file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
            </div>

            <button onclick="uploadSlip()" id="submit-btn" class="w-full bg-green-600 text-white font-semibold py-2.5 rounded-lg hover:bg-green-700 transition duration-200">
                ตรวจสอบและบันทึกสลิป
            </button>
        </div>

        <!-- ส่วนแสดงผลลัพธ์ -->
        <div id="result-box" class="hidden border-t pt-4 space-y-2">
            <h2 class="font-semibold text-gray-800">ผลการตรวจสอบ:</h2>
            <div id="result-content" class="bg-gray-50 p-3 rounded-lg text-sm text-gray-700 whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        // แทนที่ LIFF ID ของคุณตรงนี้
        const LIFF_ID = "2011278014-ykejPzwR";

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById('user-info').innerText = `ยินดีต้อนรับ, ${profile.displayName}`;
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error('LIFF Initialization failed:', error);
                document.getElementById('user-info').innerText = 'ใช้งานโหมดทดสอบทั่วไป (ไม่ได้รันผ่าน LINE)';
            }
        }

        async function uploadSlip() {
            const fileInput = document.getElementById('slip-file');
            const expectedAmount = document.getElementById('expected-amount').value;
            const resultBox = document.getElementById('result-box');
            const resultContent = document.getElementById('result-content');
            const submitBtn = document.getElementById('submit-btn');

            if (fileInput.files.length === 0) {
                alert('กรุณาเลือกรูปภาพสลิปก่อนครับ');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('expected_amount', expectedAmount);

            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังประมวลผล...';

            try {
                // เชื่อมต่อไปยัง Backend FastAPI ที่รันอยู่
                const response = await fetch('https://tp-extra-system-production.up.railway.app/api/upload-slip', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                resultBox.classList.remove('hidden');
                
                if (data.ai_result && data.ai_result.status === 'success') {
                    resultContent.innerHTML = `<span class="text-green-600 font-bold">✓ ${data.ai_result.message}</span>\nยอดเงิน: ${data.ai_result.data.extracted_amount} บาท\nเลขที่อ้างอิง: ${data.ai_result.data.reference_no}\nบันทึกลงฐานข้อมูลเรียบร้อย`;
                } else {
                    resultContent.innerHTML = `<span class="text-red-600 font-bold">✗ ตรวจสอบไม่ผ่าน</span>\nเหตุผล: ${data.ai_result ? data.ai_result.message : 'เกิดข้อผิดพลาด'}`;
                }
            } catch (error) {
                resultBox.classList.remove('hidden');
                resultContent.innerHTML = `<span class="text-red-600">ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ Backend ได้ (${error})</span>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ตรวจสอบและบันทึกสลิป';
            }
        }

        // เริ่มต้นการทำงาน LIFF เมื่อโหลดหน้าเว็บ
        initializeLiff();
    </script>
</body>
</html>
