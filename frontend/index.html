<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TP EXTRA - หน้าหลัก</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- แถบเมนูด้านบน -->
    <nav class="bg-purple-700 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">TP EXTRA</h1>
        <div id="profile-img-container" class="w-10 h-10 rounded-full bg-purple-500 overflow-hidden hidden">
            <img id="profile-img" src="" alt="Profile" class="w-full h-full object-cover">
        </div>
    </nav>

    <main class="p-4 max-w-md mx-auto space-y-6 mt-4">
        
        <!-- ส่วนแสดงข้อมูลต้อนรับ -->
        <div class="bg-white rounded-2xl shadow-sm p-6 text-center">
            <h2 class="text-lg text-gray-600">ยินดีต้อนรับ</h2>
            <p id="user-name" class="text-2xl font-bold text-gray-800 mt-1">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- ฟอร์มลงทะเบียน (จะซ่อนไว้ถ้าระบบเช็คว่าสมัครแล้วในอนาคต) -->
        <div id="register-section" class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">ลงทะเบียนสายงาน</h3>
            
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล (ตามจริง)</label>
                    <input type="text" id="full-name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="สมชาย ใจดี">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์ (10 หลัก)</label>
                    <input type="tel" id="phone" required pattern="[0-9]{9,10}" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="0812345678">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วัน/เดือน/ปีเกิด</label>
                    <input type="date" id="birth-date" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผู้แนะนำ (Upline Code)</label>
                    <input type="text" id="upline-code" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="เช่น TPX-12345 (ถ้ามี)">
                </div>

                <div class="flex items-start mt-4">
                    <input type="checkbox" id="consent" required class="mt-1 mr-2 w-4 h-4 text-purple-600 rounded">
                    <label for="consent" class="text-sm text-gray-600">ข้าพเจ้ายืนยันว่ามีอายุครบเกณฑ์ตามกฎหมาย และยอมรับเงื่อนไขการใช้งานระบบ</label>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 transition duration-200 mt-4 shadow-md">
                    ยืนยันการลงทะเบียน
                </button>
            </form>

            <!-- กล่องแสดงผลลัพธ์ -->
            <div id="result-box" class="hidden mt-4 p-4 rounded-lg text-sm font-medium text-center"></div>
        </div>

    </main>

    <script>
        const LIFF_ID = "2011278014-ykejPzwR";
        let lineUserId = null;

        // 1. เริ่มต้นการทำงาน LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId;
                    
                    // แสดงชื่อและรูปโปรไฟล์
                    document.getElementById('user-name').innerText = profile.displayName;
                    if(profile.pictureUrl) {
                        const imgContainer = document.getElementById('profile-img-container');
                        const img = document.getElementById('profile-img');
                        img.src = profile.pictureUrl;
                        imgContainer.classList.remove('hidden');
                    }
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error('LIFF Error:', error);
                document.getElementById('user-name').innerText = 'ผู้ใช้งานทั่วไป (ไม่ได้รันผ่าน LINE)';
            }
        }

        // 2. จัดการฟอร์มลงทะเบียน
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // ป้องกันเว็บรีเฟรช
            
            const submitBtn = document.getElementById('submit-btn');
            const resultBox = document.getElementById('result-box');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังส่งข้อมูล...';
            submitBtn.classList.replace('bg-purple-600', 'bg-gray-400');
            resultBox.classList.add('hidden');

            // เตรียมข้อมูลส่งเข้า API
            const payload = {
                full_name: document.getElementById('full-name').value,
                phone_number: document.getElementById('phone').value,
                upline_member_code: document.getElementById('upline-code').value || null,
                line_user_id: lineUserId,
                birth_date: document.getElementById('birth-date').value,
                is_consent_age: document.getElementById('consent').checked
            };

            try {
                const response = await fetch('https://tp-extra-system-production.up.railway.app/api/v1/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                resultBox.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                if (response.ok) {
                    // ลงทะเบียนสำเร็จ
                    resultBox.classList.add('bg-green-100', 'text-green-700');
                    resultBox.innerHTML = `✅ ${data.message}<br><span class="text-lg font-bold">รหัสของคุณ: ${data.member_code}</span>`;
                    document.getElementById('register-form').reset();
                } else {
                    // ติด Error จาก Backend (เช่น เบอร์ซ้ำ)
                    resultBox.classList.add('bg-red-100', 'text-red-700');
                    resultBox.innerText = `❌ ข้อผิดพลาด: ${data.detail}`;
                }
            } catch (error) {
                resultBox.classList.remove('hidden');
                resultBox.classList.add('bg-red-100', 'text-red-700');
                resultBox.innerText = '❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ยืนยันการลงทะเบียน';
                submitBtn.classList.replace('bg-gray-400', 'bg-purple-600');
            }
        });
        
                    // ตรวจสอบว่าเป็นลิงก์เปิดรหัสบริษัทหรือไม่
            const urlParams = new URLSearchParams(window.location.search);
            const isGenesis = urlParams.get('role') === 'genesis';

            if (isGenesis) {
                // ซ่อนช่องผู้แนะนำและปลดล็อก required
                const uplineInput = document.getElementById('upline-code');
                const uplineBox = uplineInput.closest('div');
                uplineBox.style.display = 'none';
                uplineInput.removeAttribute('required');
                uplineInput.value = 'COMPANY-ROOT';
            }

        // เรียกใช้งานตอนเปิดหน้าเว็บ
        initializeLiff();
    </script>
</body>
</html>
